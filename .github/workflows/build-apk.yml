name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          unzip -q Isekai_Frontier_Android_Ready.zip -d extracted
          cp -r extracted/isekai_game/* .
          rm -rf extracted

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/IsekaiFrontier.apk"

          [preset.0.options]
          package/unique_name="com.isekaifrontier.game"
          package/name="Isekai Frontier"
          version/code=1
          version/name="1.0"
          package/signed=true
          package/installer/enable_google_play_store=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/32_bits_framebuffer=true
          screen/immersive_mode=true
          input_devices/pointing/emulate_touch_from_mouse=true
          input_devices/pointing/emulate_mouse_from_touch=true
          EOF

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/IsekaiFrontier.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Isekai-Frontier-APK
          path: build/IsekaiFrontier.apk
